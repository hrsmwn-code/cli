# Fork-only: publish ghcr.io/<owner>/cli, a container image of the fallback
# CLI (machine client / site in Docker). Uses the linux binaries from the
# fork's latest GitHub release, upstream's entrypoint.sh, and Docker Hub
# base images (public.ecr.aws rate-limits shared runners).
name: fork-image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to package (default: latest release)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fallback
      - name: Download release binaries
        id: rel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          tag="$TAG"
          [ -n "$tag" ] || tag=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          gh release download "$tag" -R "$GITHUB_REPOSITORY" -D dist \
            -p 'pangolin-cli_linux_amd64' -p 'pangolin-cli_linux_arm64' -p SHA256SUMS
          (cd dist && grep -E 'linux_(amd64|arm64)$' SHA256SUMS | sha256sum -c -)
          chmod +x dist/pangolin-cli_*
      - name: Dockerfile
        run: |
          cat > Dockerfile.fork <<'EOF'
          FROM alpine:3.23
          ARG TARGETARCH
          RUN apk --no-cache add ca-certificates tzdata iputils iptables ip6tables tcpdump curl bind-tools iproute2
          COPY dist/pangolin-cli_linux_${TARGETARCH} /usr/local/bin/pangolin-cli
          RUN ln -s pangolin-cli /usr/local/bin/pangolin
          COPY entrypoint.sh /
          RUN chmod +x /entrypoint.sh
          ENTRYPOINT ["/entrypoint.sh"]
          CMD ["pangolin-cli"]
          EOF
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.fork
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cli:${{ steps.rel.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/cli:fallback
